version: 1

project:
  id: csci9-textbook
  title: CSCI 9 - Practical Data Science
  description: Textbook that follows the lectures for CSCI 9 Practical Data Science at El Camino College.
  parse:
    myst_enable_extensions:
      - html_image
  toc:
    - file: intro.md
      title: "Welcome to CSCI 9"
    - file: intro/index.md
      title: "1. Introduction"
      children:
        - file: intro/what-is-data-science.md
          title: "What is data science?"
        - file: intro/why-data-science-matters.md
          title: "Why data science matters"
        - file: intro/lifecycle.ipynb
          title: "The Data Science Lifecycle"
    - file: pandas-i/index.md
      title: "2. Pandas I"
    - file: pandas-ii/index.md
      title: "3. Pandas II"
    - file: pandas-iii/index.md
      title: "4. Pandas III"
    - file: eda/index.md
      title: "5. EDA"
    - file: text-wrangling-regex/index.md
      title: "6. Text Wrangling and Regex"
    - file: visualization-i/index.md
      title: "7. Visualization"
    - file: visualization-ii/index.md
      title: "8. Visualization II"
    - file: sampling/index.md
      title: "9. Sampling"
    - file: modeling-i/index.md
      title: "10. Modeling I"
    - file: modeling-ii/index.md
      title: "11. Modeling II"
    - file: modeling-iii/index.md
      title: "12. Modeling III"
    - file: modeling-iv/index.md
      title: "13. Modeling IV"
    - file: sql-i/index.md
      title: "14. SQL I"
    - file: sql-ii/index.md
      title: "15. SQL II"

site:
  template: book-theme
  options:
    logo: logo.png
    favicon: favicon.ico
    logo_text: CSCI 9 Textbook
    folders: true
