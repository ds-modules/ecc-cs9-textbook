version: 1

project:
  id: csci9-textbook
  title: CSCI 9 - Practical Data Science
  description: Textbook that follows the lectures for CSCI 9 Practical Data Science at El Camino College.
  parse:
    myst_enable_extensions:
      - html_image
  toc:
    - file: intro.md
    - file: book/intro/intro.md
      title: "1. Introduction"
      children:
        - file: book/intro/what-is-data-science.md
          title: "What is data science?"
        - file: book/intro/why-data-science-matters.md
          title: "Why data science matters"
        - file: book/intro/lifecycle.ipynb
          title: "The Data Science Lifecycle"
    - file: book/pandas-i/pandas-i.md
      title: "2. Pandas I"
    - file: book/pandas-ii/pandas-ii.md
      title: "3. Pandas II"
    - file: book/pandas-iii/pandas-iii.md
      title: "4. Pandas III"
    - file: book/eda/eda.md
      title: "5. EDA"
    - file: book/text-wrangling-regex/text-wrangling-regex.md
      title: "6. Text Wrangling and Regex"
    - file: book/visualization-i/visualization-i.md
      title: "7. Visualization"
    - file: book/visualization-ii/visualization-ii.md
      title: "8. Visualization II"
    - file: book/sampling/sampling.md
      title: "9. Sampling"
    - file: book/modeling-i/modeling-i.md
      title: "10. Modeling I"
    - file: book/modeling-ii/modeling-ii.md
      title: "11. Modeling II"
    - file: book/modeling-iii/modeling-iii.md
      title: "12. Modeling III"
    - file: book/modeling-iv/modeling-iv.md
      title: "13. Modeling IV"
    - file: book/sql-i/sql-i.md
      title: "14. SQL I"
    - file: book/sql-ii/sql-ii.md
      title: "15. SQL II"

site:
  template: book-theme
  options:
    logo: logo.png
    favicon: favicon.ico
    logo_text: CSCI 9 Textbook
